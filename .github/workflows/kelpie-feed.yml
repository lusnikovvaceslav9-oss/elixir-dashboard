name: Kelpie data feed

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feed dependencies
        run: pip install -r scripts/kelpie-feed/requirements.txt

      - name: Run Kelpie feed (PostHog)
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: python scripts/kelpie-feed/__main__.py --work-dir .

      - name: Commit updated Kelpie data
        run: |
          git config user.name "Kelpie Feed Bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/kelpie-daily.csv data/kelpie-meta.json
          if git diff --staged --quiet; then
            echo "No Kelpie data changes"
            exit 0
          fi
          git commit -m "chore: auto-update Kelpie feed data"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push conflict, rebase attempt $i"
            git pull --rebase origin main
          done
          echo "::error::Failed to push Kelpie feed after retries"
          exit 1

  deploy-pages:
    needs: update
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Prepare site artifact
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' --exclude 'secrets.env' \
            --exclude '_buyer-extract' --exclude '.venv' \
            --exclude 'venv' --exclude '__pycache__' --exclude 'worker' \
            --exclude '.quadcodeai' --exclude '.temp' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
