name: Izdaniya data feed

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feed dependencies
        run: pip install -r scripts/hupp-feed/requirements.txt

      - name: Run Izdaniya feed (Metrika + Direct)
        env:
          HUPP_METRIKA_OAUTH_TOKEN: ${{ secrets.HUPP_METRIKA_OAUTH_TOKEN }}
          IZDANIYA_METRIKA_COUNTER_ID: "111409801"
          HUPP_DIRECT_OAUTH_TOKEN: ${{ secrets.HUPP_DIRECT_OAUTH_TOKEN }}
          DIRECT_OAUTH_TOKEN: ${{ secrets.DIRECT_OAUTH_TOKEN }}
          HUPP_DIRECT_CLIENT_LOGIN: partners-m
        run: python scripts/hupp-feed/__main__.py --work-dir . --config config/izdaniya.json

      - name: Commit updated Izdaniya data
        run: |
          git config user.name "Izdaniya Feed Bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/izdaniya-daily.csv data/izdaniya-meta.json
          if git diff --staged --quiet; then
            echo "No Izdaniya data changes"
            exit 0
          fi
          git commit -m "chore: auto-update Izdaniya feed data"
          git push origin HEAD:main
