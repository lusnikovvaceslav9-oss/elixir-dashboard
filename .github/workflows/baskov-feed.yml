name: Baskov TG channel feed

on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [baskov-csv-upload]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feed dependencies
        run: pip install -r scripts/hupp-feed/requirements.txt

      - name: Run Baskov feed (Direct + Metrika/TgTrack when IDs are set)
        env:
          HUPP_METRIKA_OAUTH_TOKEN: ${{ secrets.HUPP_METRIKA_OAUTH_TOKEN }}
          HUPP_DIRECT_OAUTH_TOKEN: ${{ secrets.HUPP_DIRECT_OAUTH_TOKEN }}
          DIRECT_OAUTH_TOKEN: ${{ secrets.DIRECT_OAUTH_TOKEN }}
          DIRECT_CLIENT_LOGIN: doxmediagroup
        run: python scripts/hupp-feed/__main__.py --work-dir . --config config/baskov.json

      - name: Commit updated Baskov data
        run: |
          git config user.name "Baskov Feed Bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/baskov-daily.csv data/baskov-meta.json
          if git diff --staged --quiet; then
            echo "No Baskov data changes"
            exit 0
          fi
          git commit -m "chore: auto-update Baskov feed data"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push conflict, rebase attempt $i"
            git pull --rebase origin main
          done
          echo "::error::Failed to push Baskov feed after retries"
          exit 1

  deploy-pages:
    needs: update
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Prepare site artifact
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' --exclude 'secrets.env' \
            --exclude '_buyer-extract' --exclude '.venv' \
            --exclude 'venv' --exclude '__pycache__' --exclude 'worker' \
            --exclude '.quadcodeai' --exclude '.temp' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
