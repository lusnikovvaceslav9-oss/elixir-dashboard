name: ColorStylist data feed

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/buyer-feed/requirements.txt

      - name: Run ColorStylist feed
        working-directory: ${{ github.workspace }}
        env:
          # ColorStylist-specific secrets (separate from Planto — different app/campaign/DB).
          APPMETRICA_OAUTH_TOKEN: ${{ secrets.CS_APPMETRICA_OAUTH_TOKEN }}
          APPMETRICA_APPLICATION_ID: ${{ secrets.CS_APPMETRICA_APPLICATION_ID }}
          DIRECT_OAUTH_TOKEN: ${{ secrets.CS_DIRECT_OAUTH_TOKEN }}
          DIRECT_CLIENT_LOGIN: ${{ secrets.CS_DIRECT_CLIENT_LOGIN }}
          SUPABASE_DB_URL: ${{ secrets.CS_SUPABASE_DB_URL }}
          # AI spend (Polza). Секрет в GitHub: POLZA_AI_API_KEY.
          POLZA_AI_API_KEY: ${{ secrets.POLZA_AI_API_KEY }}
          POLZA_API_KEY: ${{ secrets.POLZA_API_KEY }}
        run: python scripts/buyer-feed/__main__.py --work-dir . --config config/colorstylist.json

      - name: Commit updated data
        run: |
          git config user.name "ColorStylist Feed Bot"
          git config user.email "feed-bot@users.noreply.github.com"
          echo "=== data after feed ==="
          ls -la data/colorstylist-* || true
          python3 -c "import json; m=json.load(open('data/colorstylist-meta.json')); print('until:', m.get('until'), 'days:', m.get('days'), 'errors:', m.get('errors')); print('ai_spend:', m.get('ai_spend'))" || true
          git add data/colorstylist-daily.csv data/colorstylist-cohort.json data/colorstylist-meta.json data/colorstylist-product.json
          git status --short
          if git diff --staged --quiet; then
            echo "::warning::No data changes — verify CS_* / POLZA_* GitHub Secrets and API access"
            exit 0
          fi
          git commit -m "chore: auto-update ColorStylist feed data"
          # Параллельные фиды (Hupp/Planto) часто успевают запушить раньше — rebase и retry.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push conflict, rebase attempt $i"
            git pull --rebase origin main
          done
          echo "::error::Failed to push ColorStylist feed after retries"
          exit 1

  # GITHUB_TOKEN push не триггерит pages.yml — деплоим сайт здесь же.
  deploy-pages:
    needs: update
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Prepare site artifact
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' --exclude 'secrets.env' \
            --exclude '_buyer-extract' --exclude '.venv' \
            --exclude 'venv' --exclude '__pycache__' --exclude 'worker' \
            --exclude '.quadcodeai' --exclude '.temp' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
